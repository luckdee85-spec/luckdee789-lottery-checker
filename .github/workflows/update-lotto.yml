name: Update Thai Lottery Results

on:
  schedule:
    - cron: '5 9 1,16 * *'
    - cron: '35 9 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update lottery results" && git push)
