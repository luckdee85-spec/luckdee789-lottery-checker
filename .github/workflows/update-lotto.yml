name: Update Thai Lottery Results

on:
  schedule:
    - cron: '5 9 1,16 * *'
    - cron: '35 9 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and format lottery data
        run: |
          python3 -c 'import urllib.request, json; req = urllib.request.Request("https://lotto.api.rayriffy.com/latest", headers={"User-Agent": "Mozilla/5.0"}); raw = json.loads(urllib.request.urlopen(req).read().decode("utf-8"))["response"]; formatted = {"draw_date": raw["date"], "source": "สำนักงานสลากกินแบ่งรัฐบาล", "prizes": {"first": raw["prizes"][0]["number"], "near_first": raw["prizes"][1]["number"], "prize_2": raw["prizes"][2]["number"], "prize_3": raw["prizes"][3]["number"], "prize_4": raw["prizes"][4]["number"], "prize_5": raw["prizes"][5]["number"], "front3": raw["runningNumbers"][0]["number"], "last3": raw["runningNumbers"][1]["number"], "last2": raw["runningNumbers"][2]["number"]}}; open("data/results.json", "w", encoding="utf-8").write(json.dumps(formatted, ensure_ascii=False, indent=2))'

      - name: Commit and push updated results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update lottery results" && git push)
กดปุ่มสีเขียว Commit changes... แล้วกลับไปที่แท็บ Actions > กด Run workflow อีกรอบ รอบนี้
